name: North Africa Hub consistency fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Rebrand visible product language without renaming technical identifiers.
          extensions = {'.tsx', '.ts', '.css', '.md', '.json'}
          replacements = {
              'Koshary and Couscous': 'North Africa Hub',
              'Koshary & Couscous': 'North Africa Hub',
              'Koshary + Couscous': 'North Africa Hub',
          }
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in extensions or '.next' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Root metadata + global visual-system override.
          layout = Path('app/layout.tsx')
          text = layout.read_text(encoding='utf-8')
          if "import './north-africa-hub-brand.css';" not in text:
              text = text.replace("import './matrix-theme.css';", "import './matrix-theme.css';\nimport './north-africa-hub-brand.css';")
          text = text.replace("title: 'Koshary and Couscous'", "title: 'North Africa Hub'")
          text = text.replace("applicationName: 'Koshary and Couscous'", "applicationName: 'North Africa Hub'")
          layout.write_text(text, encoding='utf-8')

          shell = Path('components/navigation/north-africa-shell.tsx')
          if shell.exists():
              text = shell.read_text(encoding='utf-8')
              text = text.replace('North Africa home', 'North Africa Hub home')
              text = text.replace('>North Africa</span>', '>North Africa Hub</span>')
              text = text.replace('aria-label="North Africa navigation"', 'aria-label="North Africa Hub navigation"')
              shell.write_text(text, encoding='utf-8')

          # History gets a semantic wrapper so its hero can share the global system.
          history_layout = Path('app/history/layout.tsx')
          history_text = history_layout.read_text(encoding='utf-8')
          history_text = re.sub(r'return children;', 'return <div className="history-page">{children}</div>;', history_text)
          history_layout.write_text(history_text, encoding='utf-8')

          # Replace direct client-side historical image URLs with a same-origin image gateway.
          history_page = Path('app/history/page.tsx')
          history_text = history_page.read_text(encoding='utf-8')
          image_block = """const historicalImage = (query:string,fallback:string) => `/api/images/pixabay?q=${encodeURIComponent(query)}&fallback=${encodeURIComponent(fallback)}`;

const img = {
  giza:historicalImage('Giza pyramids Egypt','https://commons.wikimedia.org/wiki/Special:FilePath/All%20Gizah%20Pyramids.jpg'),
  carthage:historicalImage('Carthage ruins Tunisia','https://commons.wikimedia.org/wiki/Special:FilePath/Carthage%20ruins%20Tunisia.jpg'),
  alexandria:historicalImage('Alexandria Egypt library','https://commons.wikimedia.org/wiki/Special:FilePath/Alexandria%20Egypt%20Bibliotheca.jpg'),
  lepcis:historicalImage('Leptis Magna Libya Roman ruins','https://commons.wikimedia.org/wiki/Special:FilePath/Leptis%20Magna%20Roman%20theatre.jpg'),
  volubilis:historicalImage('Volubilis Morocco ruins','https://commons.wikimedia.org/wiki/Special:FilePath/Volubilis%20Morocco.jpg'),
  kairouan:historicalImage('Great Mosque Kairouan Tunisia','https://commons.wikimedia.org/wiki/Special:FilePath/Great%20Mosque%20of%20Kairouan.jpg'),
  casbah:historicalImage('Casbah Algiers Algeria','https://commons.wikimedia.org/wiki/Special:FilePath/Casbah%20of%20Algiers.jpg'),
  tunis:historicalImage('Tunis medina Tunisia','https://commons.wikimedia.org/wiki/Special:FilePath/Tunis%20medina.jpg'),
  cairo:historicalImage('Cairo Egypt citadel','https://commons.wikimedia.org/wiki/Special:FilePath/Cairo%20Egypt%20citadel.jpg'),
  fez:historicalImage('Fez Morocco medina','https://commons.wikimedia.org/wiki/Special:FilePath/Fez%20Morocco%20medina.jpg'),
  desert:historicalImage('Sahara desert Algeria','https://commons.wikimedia.org/wiki/Special:FilePath/Sahara%20desert%20Algeria.jpg'),
  med:historicalImage('Mediterranean coast Tunisia','https://commons.wikimedia.org/wiki/Special:FilePath/Mediterranean%20Sea%20coast%20Tunisia.jpg'),
};"""
          history_text, count = re.subn(r"const img = \{.*?\n\};", image_block, history_text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate the History image registry; refusing to make a partial change.')
          history_page.write_text(history_text, encoding='utf-8')

          # Server-side Pixabay gateway. Pixabay is preferred when configured; existing historical
          # source URLs are fetched server-side as a safe fallback, never permanently hotlinked.
          route = Path('app/api/images/pixabay/route.ts')
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text(r'''import {NextRequest,NextResponse} from 'next/server';

const CACHE_SECONDS = 60 * 60 * 24;

function cachedHeaders(contentType:string){
  return {
    'Content-Type': contentType,
    'Cache-Control': `public, s-maxage=${CACHE_SECONDS}, stale-while-revalidate=${CACHE_SECONDS * 7}`,
    'X-Content-Type-Options': 'nosniff',
  };
}

async function fetchImage(url:string){
  const response = await fetch(url,{cache:'no-store',headers:{Accept:'image/avif,image/webp,image/jpeg,image/png,image/*;q=0.8'}});
  if(!response.ok) throw new Error(`Image upstream returned ${response.status}`);
  const contentType = response.headers.get('content-type')?.split(';')[0] || 'image/jpeg';
  if(!contentType.startsWith('image/')) throw new Error('Upstream response was not an image');
  return new NextResponse(await response.arrayBuffer(),{status:200,headers:cachedHeaders(contentType)});
}

export async function GET(request:NextRequest){
  const query=request.nextUrl.searchParams.get('q')?.trim();
  const fallback=request.nextUrl.searchParams.get('fallback')?.trim();
  if(!query && !fallback) return NextResponse.json({error:'Missing image query'},{status:400});

  const key=process.env.PIXABAY_API_KEY?.trim();
  if(key && query){
    try{
      const params=new URLSearchParams({key,q:query,image_type:'photo',orientation:'horizontal',safesearch:'true',order:'popular',per_page:'3',page:'1'});
      const response=await fetch(`https://pixabay.com/api/?${params.toString()}`,{next:{revalidate:CACHE_SECONDS}});
      if(response.ok){
        const data=await response.json() as {hits?:Array<{largeImageURL?:string;webformatURL?:string}>};
        const selected=data.hits?.[0]?.largeImageURL || data.hits?.[0]?.webformatURL;
        if(selected) return await fetchImage(selected);
      }
    }catch{}
  }

  if(fallback){
    try{return await fetchImage(fallback);}catch{}
  }

  return new NextResponse(null,{status:404,headers:{'Cache-Control':'public, max-age=300'}});
}
''', encoding='utf-8')

          env = Path('.env.example')
          env_text = env.read_text(encoding='utf-8')
          if 'PIXABAY_API_KEY=' not in env_text:
              env_text += '\n# Optional Pixabay API key. Kept server-side; never expose as NEXT_PUBLIC_*.\nPIXABAY_API_KEY=""\n'
          env.write_text(env_text, encoding='utf-8')

          # One authoritative override layer. History uses the same tokens, typography and controls
          # as the rest of the application instead of its former alternate visual language.
          brand_css = Path('app/north-africa-hub-brand.css')
          brand_css.write_text(r'''/* North Africa Hub: final cross-site consistency layer. Keep this file small and token-driven. */
:root{
  --text-primary:var(--ink);
  --text-secondary:var(--muted);
  --text-muted:var(--muted);
  --surface:var(--panel);
  --surface-secondary:var(--bg);
  --border:var(--line);
  --border-hover:color-mix(in srgb,var(--line) 65%,var(--ink) 35%);
}

.history-page{background:var(--bg);color:var(--ink);}
.history-page [class*="hero_"]{background:var(--bg);color:var(--ink);}
.history-page [class*="heroImage"]{opacity:.16;filter:grayscale(1) saturate(.2) contrast(.9);}
.history-page [class*="heroOverlay"]{background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 94%,transparent),color-mix(in srgb,var(--bg) 78%,transparent) 58%,color-mix(in srgb,var(--bg) 88%,transparent));}
.history-page [class*="heroContent"]{color:var(--ink);}
.history-page [class*="heroContent"] .eyebrow{color:var(--muted);}
.history-page [class*="heroContent"] h1,
.history-page [class*="heroContent"] h1 em{font-family:inherit;color:var(--ink);}
.history-page [class*="heroContent"] p{color:var(--muted);}
.history-page [class*="heroActions"] a{border:1px solid var(--line);background:var(--panel);color:var(--ink);backdrop-filter:none;transition:background .18s ease,color .18s ease,border-color .18s ease;}
.history-page [class*="heroActions"] a:first-child{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.history-page [class*="heroActions"] a:hover{border-color:var(--border-hover);background:var(--bg);color:var(--ink);}
.history-page [class*="heroActions"] a:first-child:hover{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.history-page [class*="heroActions"] a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* Prevent stale page-specific colors from creating a second design system. */
.history-page [class*="page_"]{background:var(--bg);color:var(--ink);}
.history-page [class*="card"],
.history-page [class*="mapTeaser"]>div:first-child,
.history-page [class*="thenNowCenter"],
.history-page [class*="controls"] input,
.history-page [class*="controls"] select,
.history-page [class*="tabs"] button,
.history-page [class*="sourceLinks"] a{background:var(--panel);color:var(--ink);border-color:var(--line);}
.history-page [class*="card"] p,
.history-page [class*="sectionHead"]>p,
.history-page [class*="introGrid"] p,
.history-page [class*="mapTeaser"] p,
.history-page [class*="featureGrid"] p,
.history-page [class*="sources"] p{color:var(--muted);}
.history-page [class*="cardImage"]{background:var(--line);}
.history-page a{color:var(--ink);}
.history-page a:hover{color:var(--accent);}
.history-page button:focus-visible,
.history-page input:focus-visible,
.history-page select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

@media(max-width:620px){
  .history-page [class*="heroContent"]{padding-left:20px;padding-right:20px;}
}
''', encoding='utf-8')

          # The workflow is intentionally self-removing after it performs its one-shot mutation.
          workflow = Path('.github/workflows/na-hub-fix.yml')
          if workflow.exists(): workflow.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m '[bot] Apply North Africa Hub production consistency and image fixes'
          git push
