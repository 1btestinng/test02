name: North Africa Hub production fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and commit
        run: |
          if git log -1 --pretty=%s | grep -q '^\[bot\]'; then exit 0; fi
          python scripts/apply-na-hub-fix.py
          rm -f scripts/apply-na-hub-fix.py .github/workflows/na-hub-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[bot] Apply North Africa Hub production consistency and image fixes'
          git push
